<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ZA Electronics - Login</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

```
<!-- =========================
     NAVIGATION
========================== -->

<header>

    <div class="name">

        <a href="index.html">

            <img
                src="canva/logo.png"
                alt="ZA Electronics Logo"
            >

        </a>

    </div>

    <button
    class="menu-btn"
    id="menuBtn"
    aria-label="Open navigation menu"
    aria-expanded="false"
>
    ☰
</button>


    <nav>

        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="faq.html">
                    FAQ
                </a>
            </li>

            <li>
                <a href="gallery.html">
                    Gallery
                </a>
            </li>

            

            <li>
                <a href="blog.html">
                    Blog
                </a>
            </li>

            <li>
                <a href="login.html"
                class="active"
                aria-current="page">
                    Login
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================
     LOGIN SECTION
========================== -->

<section class="login-section">


    <div class="login-box">


        <h1>
            Welcome <span>Back</span>
        </h1>


        <p class="subtitle">
            Login to your ZA Electronics account
        </p>



        <!-- EMAIL -->

        <div class="input-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

        </div>



        <!-- PASSWORD -->

        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

        </div>



        <!-- OPTIONS -->

        <div class="login-options">

            <label class="remember">

                <input
                    type="checkbox"
                >

                Remember me

            </label>


            <a href="#"
               class="forgot">

                Forgot Password?

            </a>

        </div>



        <!-- LOGIN BUTTON -->

        <button
            class="login-button"
            onclick="loginUser()">

            Login

        </button>



        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>



        <!-- SIGN UP -->

        <div class="signup">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>


    </div>


</section>



<!-- =========================
     FOOTER
========================== -->

<footer>

    <h2>
        ZA Electronics
    </h2>


    <p>
        Quality electronics for everyday life.
    </p>


    <small>
        &copy; 2026 ZA Electronics.
        All rights reserved.
    </small>

</footer>



<!-- =========================
     JAVASCRIPT
========================== -->

<script src="js/login.js">

   
</script>
```

</body>

</html>
